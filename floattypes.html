<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloatTypes</title>
    <style>
        .p1 {
            width: 80vw;
            height: 80vh;
            background: red;
        }

        .c1 {
            width: 100px;
            height: 100px;
            float: left;
            background: green;
        }
        .c2 {
            margin: 15px;
            width: 100px;
            height: 100px;
            background: yellow;
            float: left;
            /* float: clear; */
        }
        .c3 {
            width: 100px;
            height: 100px;
            background: blue;
            clear: both;
        }
    </style>
</head>

<body>
    <div class="p1">
        <div class="c1"></div>
        <div class="c2"></div>
        <div class="c3"></div>
    </div>
</body>

</html>
