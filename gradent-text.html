<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradentText</title>
    <style>
        .gradent-text{
            font-size: 48px;
            font-weight: bold;
            /* Gradient background */
            background: linear-gradient(to right, red,green,yellow,blue, orange);
            /* Apply the background to text */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div>
        <h1 class="gradent-text">This is gradent text</h1>
    </div>
</body>
</html>
