<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxshadow</title>
    <style>
        .test-shadow{
            background: yellow;
            margin: 20px;
            width: 100px;
            height: 100px;
            box-shadow: -10px -10px 5px 5px green,
            10px 10px 5px 5px blue
        }
    </style>
</head>
<body>
    <div class="test-shadow"></div>
</body>
</html>
