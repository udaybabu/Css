<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaQueries</title>
    <style>
      .one{
        width: 100vw;
        background-color: rebeccapurple;
        
      }
      @media (min-width:300px) and (max-width:1000px){
        .one {
            background-color: red;
        }
      }
      
    </style>
</head>
<body>
    <div>
        <div class="one"></div>
        <div class="two"></div>
    </div>
</body>
</html>
