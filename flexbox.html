<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .parent {
           width: 800px;
           height: 800px;
           background-color: grey;
           display: flex;
           /* flex-direction: row;
           flex-wrap: wrap; */
           flex-flow: column wrap ;
           justify-content: center;
           /* align-items: center; */
           /* align-content: center; */
        }
        .child {
          width: 100px;
          height: 100px;
        }
        #c1{
            /* flex-grow: 1; */
            order:8 ;
            background: yellow;
            align-self: center;
        }
        #c2{
            order: 3;
            /* flex-shrink: 10; */
            background: green;
            align-self: center;
        }
        #c3{
            /* flex-grow: 3; */
            order:9 ;
            background: red;
            align-self: flex-end;
        }
        #c4{
            orphans: 1;
            background: blue;
        }
        #c5{
            background:purple;
        }
    </style>
</head>
<body>
    <div class="parent">
       <div class="child" id="c1">Child1</div>
       <div class="child" id="c2">Child2</div>
       <div class="child" id="c3">Child3</div>
       <div class="child" id="c4">Child4</div>

</html>
