<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index</title>
    <style>
        .p1 {
            width: 80vw;
            height: 80vh;
            background: red;
        }

        .c1 {
            position: absolute;
            width: 100px;
            height: 100px;
            background: green;
            z-index: 3;
        }

        .c2 {
            position: absolute;
            margin: 10px;
            width: 100px;
            height: 100px;
            background: yellow; 
            z-index: 2;
        }

        .c3 {
            position: absolute;
            margin: 20px;
            width: 100px;
            height: 100px;
            background: blue;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="p1">
        <div class="c1"></div>
        <div class="c2"></div>
        <div class="c3"></div>
    </div>
</body>

</html>
