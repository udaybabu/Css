<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positions</title>
    <!-- static
    absolute
    relative
    fixed
    sticky -->
    <style>
        .d1{
            /* position: static; */
            /* position: fixed; */
            left: 10px;
            top: 10px;
            width: 100%;
            height: 300px;
            background: rebeccapurple;
            
        }
        .d2{
            /* position: absolute; */
            position: sticky;
            top: 10px;
            left: 10px;
            background: red;
            height: 30px;
        }
        .d3{
            position: relative;
            top: 50px;
            left: 50px;
            background: greenyellow;
            height: 500px;
        }
        .d4{
            background: blue;
            height: 1000px;
        }
    </style>
</head>
<body>
    <div class="d1">div1</div>
    <div class="d2">div2</div>
    <!-- <input type="text" name="name" id="" /> -->
    <div class="d3">div3</div>
    <div class="d4">div4</div>
</body>
</html>
