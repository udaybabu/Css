<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Fonts</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Microbe&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Faster+One&family=Noto+Sans+JP:wght@100..900&family=Rubik+Microbe&display=swap"
        rel="stylesheet">
        <link rel="stylesheet" href="./google-fonts.css" />
    <style>
        .rubik-microbe-regular {
            font-size: 23px;
            font-family: "Rubik Microbe", system-ui;
            font-weight: 400;
            font-style: normal;
        }

        .faster-one-regular {
            font-family: "Faster One", system-ui;
            font-weight: 400;
            font-style: normal;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <div class="rubik-microbe-regular">This is test google fonts</div>
    <div class="faster-one-regular">This is test google fonts</div>
    <div class="test-fonts">This is test google fonts</div>
</body>

</html>
